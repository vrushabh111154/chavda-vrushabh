<html>
<head>
<title>css filter example</title>

<style>
img {
		width:300px;
		filter:grayscale(100%);
		transition:0.1s;
	}
	
img:hover {
			filter:grayscale(0%) brightness(120%);
		  }
		  
</style>
</head>
<body>
<h2>css filter property</h2>
<img src="img5.jpg" alt="img5">
</body>
</html>
